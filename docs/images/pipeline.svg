<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box{rx:12;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#f0f6fc}
      .s{font-size:12px;fill:#c9d1d9}
      .time{font-size:12px;font-weight:700;fill:#0d1117}
      .ln{stroke:#8b949e;stroke-width:2;fill:none;marker-end:url(#a)}
      .lbl{font-size:12px;fill:#8b949e;font-style:italic}
    </style>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#0d1117"/>
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f6fc">One video a day: cinematic when credits allow, stickman otherwise</text>

  <!-- start -->
  <rect class="box" x="30" y="70" width="190" height="96" fill="#161b22" stroke="#e9b44c"/>
  <rect x="30" y="70" width="70" height="22" rx="8" fill="#e9b44c"/><text class="time" x="65" y="86" text-anchor="middle">2:00 PM</text>
  <text class="t" x="125" y="115" text-anchor="middle">Timely topic</text>
  <text class="s" x="125" y="136" text-anchor="middle">festivals, jayantis, events</text>
  <text class="s" x="125" y="153" text-anchor="middle">(Claude + web search)</text>

  <!-- credits decision -->
  <rect class="box" x="270" y="70" width="190" height="96" fill="#161b22" stroke="#8b949e"/>
  <text class="t" x="365" y="105" text-anchor="middle">Flow credits?</text>
  <text class="s" x="365" y="127" text-anchor="middle">Google AI Pro account 1 / 2</text>
  <text class="s" x="365" y="145" text-anchor="middle">~130 credits per film</text>
  <path class="ln" d="M220 118 H266"/>

  <!-- cinematic lane -->
  <rect class="box" x="510" y="70" width="210" height="96" fill="#161b22" stroke="#e9b44c"/>
  <text class="t" x="615" y="105" text-anchor="middle">Film script</text>
  <text class="s" x="615" y="127" text-anchor="middle">story, character bible,</text>
  <text class="s" x="615" y="145" text-anchor="middle">8-second shot list (fact-checked)</text>
  <path class="ln" d="M460 118 H506"/><text class="lbl" x="483" y="110" text-anchor="middle">yes</text>

  <rect class="box" x="760" y="70" width="210" height="96" fill="#161b22" stroke="#e9b44c"/>
  <rect x="760" y="70" width="70" height="22" rx="8" fill="#e9b44c"/><text class="time" x="795" y="86" text-anchor="middle">2:20 PM</text>
  <text class="t" x="865" y="115" text-anchor="middle">Google Flow · Veo 3.1</text>
  <text class="s" x="865" y="136" text-anchor="middle">Claude generates &amp; checks</text>
  <text class="s" x="865" y="153" text-anchor="middle">each shot, collects clips</text>
  <path class="ln" d="M720 118 H756"/>

  <rect class="box" x="760" y="210" width="210" height="96" fill="#161b22" stroke="#e9b44c"/>
  <rect x="760" y="210" width="70" height="22" rx="8" fill="#e9b44c"/><text class="time" x="795" y="226" text-anchor="middle">4:30 PM</text>
  <text class="t" x="865" y="255" text-anchor="middle">Remotion render</text>
  <text class="s" x="865" y="276" text-anchor="middle">narrator, captions, title card,</text>
  <text class="s" x="865" y="293" text-anchor="middle">crossfades → out/cinematic/</text>
  <path class="ln" d="M865 166 V206"/>

  <rect class="box" x="760" y="350" width="210" height="70" fill="#161b22" stroke="#e9b44c"/>
  <text class="t" x="865" y="380" text-anchor="middle">Cinematic channel</text>
  <text class="s" x="865" y="401" text-anchor="middle">upload: private, AI-labelled</text>
  <path class="ln" d="M865 306 V346"/>

  <!-- stickman lane -->
  <path class="ln" d="M365 166 V346"/><text class="lbl" x="378" y="262">no credits</text>
  <rect class="box" x="250" y="350" width="230" height="70" fill="#161b22" stroke="#2a9d8f"/>
  <text class="t" x="365" y="380" text-anchor="middle">Stickman story (free)</text>
  <text class="s" x="365" y="401" text-anchor="middle">drawn in code → out/stickman/</text>

  <rect class="box" x="520" y="350" width="200" height="70" fill="#161b22" stroke="#2a9d8f"/>
  <text class="t" x="620" y="380" text-anchor="middle">Stickman channel</text>
  <text class="s" x="620" y="401" text-anchor="middle">its own YouTube channel</text>
  <path class="ln" d="M480 385 H516"/>

  <!-- fallback if clips fail -->
  <path d="M760 268 C 660 268, 560 290, 470 345" class="ln" stroke-dasharray="6 5"/>
  <text class="lbl" x="612" y="318" text-anchor="middle">clips not ready →</text><text class="lbl" x="612" y="334" text-anchor="middle">stickman today, film tomorrow</text>

  <text x="500" y="470" text-anchor="middle" font-size="13" fill="#8b949e">Formats never mix: separate topic queues, channel text, voices, folders and YouTube channels.</text>
  <text x="500" y="492" text-anchor="middle" font-size="13" fill="#8b949e">Script &amp; fact-check: Claude Code · Voice: edge-tts · Video: Remotion · Upload: YouTube Data API</text>
</svg>
